{% extends "base.html" %}

{% block title %}Interview History{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h1 class="text-3xl font-bold">Interview History</h1>
            <p class="text-gray-400 mt-1">View all completed interviews</p>
        </div>
        <a href="/" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition">New Interview</a>
    </div>

    <div id="history-loading" class="text-center py-12">
        <div class="animate-spin w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full mx-auto mb-4"></div>
        <p class="text-gray-400">Loading history...</p>
    </div>

    <div id="history-content" class="hidden space-y-3"></div>
    <div id="history-empty" class="hidden text-center py-12">
        <p class="text-gray-400">No completed interviews yet.</p>
        <a href="/" class="text-blue-400 hover:text-blue-300 mt-2 inline-block">Start your first interview</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const response = await fetch('/api/history');
        const data = await response.json();

        document.getElementById('history-loading').classList.add('hidden');

        if (!data.interviews || data.interviews.length === 0) {
            document.getElementById('history-empty').classList.remove('hidden');
            return;
        }

        const container = document.getElementById('history-content');
        container.classList.remove('hidden');

        container.innerHTML = data.interviews.map(i => {
            const scoreColor = i.score >= 70 ? 'text-green-400' : i.score >= 40 ? 'text-yellow-400' : 'text-red-400';
            const statusBg = i.status === 'completed' ? 'bg-green-900 text-green-300' : 'bg-red-900 text-red-300';
            const date = i.date ? new Date(i.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '-';

            return `
                <a href="/results/${i.id}" class="block bg-gray-800 rounded-xl p-5 border border-gray-700 hover:border-gray-600 transition">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <div class="w-12 h-12 bg-blue-600/20 rounded-full flex items-center justify-center">
                                <span class="text-blue-400 font-bold text-lg">${i.candidate_name ? i.candidate_name.charAt(0).toUpperCase() : '?'}</span>
                            </div>
                            <div>
                                <p class="font-medium">${i.candidate_name || 'Unknown'}</p>
                                <div class="flex items-center space-x-3 mt-1">
                                    <span class="px-2 py-0.5 rounded text-xs ${statusBg}">${i.status}</span>
                                    <span class="text-xs text-gray-500">${date}</span>
                                    ${i.violations > 0 ? `<span class="text-xs text-red-400">${i.violations} violations</span>` : ''}
                                    ${i.is_flagged ? '<span class="text-xs text-orange-400">⚠️ Flagged</span>' : ''}
                                </div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-3xl font-bold ${scoreColor}">${i.score ? Math.round(i.score) : '-'}</div>
                            <div class="text-xs text-gray-500">score</div>
                        </div>
                    </div>
                </a>
            `;
        }).join('');
    } catch (err) {
        document.getElementById('history-loading').innerHTML = '<p class="text-red-400">Failed to load history</p>';
    }
});
</script>
{% endblock %}
